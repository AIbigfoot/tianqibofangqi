[package]
name = "cinema-desktop"
version = "0.1.0"
edition = "2021"
description = "影院桌面客户端骨架（M0：可启动的空客户端 + 组合根）"
publish = false

# 独立 workspace：避免被根 Cargo.toml 收编，使 `cargo test`（根目录）不连带构建桌面端。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# 组合根依赖：把 L1 服务与 L3 适配器、L4 基础设施接起来
cinema-domain = { path = "../crates/domain" }
cinema-adapters = { path = "../crates/adapters" }
cinema-app = { path = "../crates/app" }
cinema-infra = { path = "../crates/infra" }
