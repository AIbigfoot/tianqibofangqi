version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: bid_db
    environment:
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpass
      POSTGRES_DB: bid_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biduser -d bid_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: bid_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://biduser:bidpass@db:5432/bid_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    container_name: bid_scheduler
    command: python -m scheduler.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg2://biduser:bidpass@db:5432/bid_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
